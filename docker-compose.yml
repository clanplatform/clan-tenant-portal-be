version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: clan-tenant-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_MULTIPLE_DATABASES: tenant_service,tenant_billing,tenant_app_config
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5410:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenant-portal-network

  redis:
    image: redis:7-alpine
    container_name: clan-tenant-portal-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6383:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenant-portal-network

  tenant-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: tenant-service
    container_name: clan-tenant-service
    restart: unless-stopped
    env_file:
      - ./config/environments/.env.local
    environment:
      SERVICE_NAME: tenant-service
      PYTHONPATH: /app:/libs
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/tenant_service
    ports:
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/tenant-service:/app
      - ./libs:/libs
    networks:
      - tenant-portal-network

  tenant-billing-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: tenant-billing-service
    container_name: clan-tenant-billing-service
    restart: unless-stopped
    env_file:
      - ./config/environments/.env.local
    environment:
      SERVICE_NAME: tenant-billing-service
      PYTHONPATH: /app:/libs
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/tenant_billing
    ports:
      - "8011:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/tenant-billing-service:/app
      - ./libs:/libs
    networks:
      - tenant-portal-network

  tenant-app-config-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: tenant-app-config-service
    container_name: clan-tenant-app-config-service
    restart: unless-stopped
    env_file:
      - ./config/environments/.env.local
    environment:
      SERVICE_NAME: tenant-app-config-service
      PYTHONPATH: /app:/libs
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/tenant_app_config
    ports:
      - "8012:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/tenant-app-config-service:/app
      - ./libs:/libs
    networks:
      - tenant-portal-network

volumes:
  postgres_data:

networks:
  tenant-portal-network:
    driver: bridge
